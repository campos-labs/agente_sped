[project]
name = "agente-sped"
version = "0.1.0"
description = "Análises locais e rastreáveis de SPED Fiscal"
authors = [
    { name = "Rogerio Campos", email = "rogerio.campos07@gmail.com" },
    { name = "Renato Campos", email = "renatocampos07@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "duckdb>=1.5,<2",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.14.1,<3.0.0",
    "pyyaml>=6.0.3,<7",
]

[project.scripts]
agente-sped = "agente_sped.interface.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "ruff>=0.15.16,<0.16.0",
]

[tool.ruff]
target-version = "py314"
line-length = 79

[tool.ruff.lint]
select = ["I", "F", "E", "W", "PL", "PT"]

[tool.ruff.format]
quote-style = "single"
