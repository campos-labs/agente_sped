[project]
name = "agente-sped"
version = "0.1.0"
description = "Análises locais e rastreáveis de SPED Fiscal"
authors = [
    { name = "Rogerio Campos", email = "rogerio.campos07@gmail.com" },
    { name = "Renato Campos", email = "renatocampos07@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "duckdb>=1.5,<2",
    "fastapi>=0.161.0,<1",
    "jinja2>=3.1.6,<4",
    "langchain-google-genai>=4.4.2,<5",
    "langgraph>=1.2.16,<2",
    "langsmith>=0.14.11,<0.15",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.14.1,<3.0.0",
    "python-multipart>=0.0.32,<0.1",
    "pyyaml>=6.0.3,<7",
    "starlette>=1.9.0,<2",
    "uvicorn>=0.54.0,<1",
    "xlsxwriter>=3.2.9,<4",
]

[project.scripts]
agente-sped = "agente_sped.interface.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=7.1,<8",
    "ruff>=0.15.16,<0.16.0",
]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra"]

[tool.coverage.run]
source = ["agente_sped"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py314"
line-length = 79

[tool.ruff.lint]
select = ["I", "F", "E", "W", "PL", "PT"]

[tool.ruff.format]
quote-style = "single"
